; use composites EXCEPT FOR й which is a separate letter, though ponomar.net doesn't think so
; ѹ as a single Unicode char is not present in known Slavonic books but it may still appear somewhere

; "и ̆" to "й"
[izhe_kratka]
from=1080,774
lowercase_to=1081

; "И ̆" to "Й" or "й"
[capital_Izhe_kratka]
from=1048,774
lowercase_to=1081
uppercase_to=1049
is_uppercase=1

; "ї" to "і ̈"
[i_diaeresis]
from=1111
lowercase_to=1110,776

; "Ї" to "І ̈" or "і ̈"
[capital_I_diaeresis]
from=1031
lowercase_to=1110,776
uppercase_to=1030,776
is_uppercase=1

; "ѷ" to "ѵ ̏"
[izhitsa_double_grave]
from=1143
lowercase_to=1141,783

; "Ѷ" to "Ѵ ̏" or "ѵ ̏"
[capital_Izhitsa_double_grave]
from=1142
lowercase_to=1141,783
uppercase_to=1140,783
is_uppercase=1

; "ѐ" to "е ̀"
[est_grave]
from=1104
lowercase_to=1077,768

; "Ѐ" to "Е ̀" or "е ̀"
[capital_Est_grave]
from=1024
lowercase_to=1077,768
uppercase_to=1045,768
is_uppercase=1

; "ѝ" to "и ̀"
[izhe_grave]
from=1117
lowercase_to=1080,768

; "Ѝ" to "И ̀" or "и ̀"
[capital_Izhe_grave]
from=1037
lowercase_to=1080,768
uppecase_to=1048,768
is_uppercase=1

